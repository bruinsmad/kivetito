name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  board-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build APK
        working-directory: board
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Kivetito-tabla-apk
          path: board/app/build/outputs/apk/release/*.apk

  laptop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            cmd: dist:mac
            out: laptop/dist/*.dmg
            name: Kivetito-mac
          - os: windows-latest
            cmd: dist:win
            out: laptop/dist/*.exe
            name: Kivetito-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build
        working-directory: laptop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm install --prefix ../relay
          npm test
          npm run ${{ matrix.cmd }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.out }}
